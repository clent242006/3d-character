<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AR 3D Character</title>

    <script type="module"
        src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.3.1/model-viewer.min.js">
    </script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111827;
            color: white;
            text-align: center;
        }

        header {
            padding: 20px;
            background: #1f2937;
        }

        h1 {
            margin: 0;
        }

        p {
            color: #d1d5db;
        }

        model-viewer {
            width: 100%;
            height: 65vh;
            background: #e5e7eb;
        }

        .controls {
            padding: 20px;
            background: #1f2937;
        }

        button {
            padding: 12px 20px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }

        #rotateButton {
            background: #10b981;
            color: white;
        }

        #stopButton {
            background: #ef4444;
            color: white;
        }

        #arButton {
            background: #2563eb;
            color: white;
        }
    </style>
</head>

<body>

    <header>
        <h1>AR 3D Character Viewer</h1>
        <p>Human-Computer Interaction Project</p>
    </header>

    <model-viewer
        id="character"
        src="https://modelviewer.dev/shared-assets/models/Astronaut.glb"
        alt="3D Astronaut"
        camera-controls
        auto-rotate
        ar
        ar-modes="webxr scene-viewer quick-look"
        ar-scale="auto"
        shadow-intensity="1"
        camera-orbit="0deg 75deg 3m">

        <button
            slot="ar-button"
            id="arButton">
            View in AR
        </button>

    </model-viewer>

    <div class="controls">

        <button id="rotateButton">
            Rotate Character
        </button>

        <button id="stopButton">
            Stop Rotation
        </button>

    </div>

    <script>

        const character =
            document.getElementById("character");

        const rotateButton =
            document.getElementById("rotateButton");

        const stopButton =
            document.getElementById("stopButton");


        rotateButton.addEventListener("click", () => {

            character.setAttribute("auto-rotate", "");

        });


        stopButton.addEventListener("click", () => {

            character.removeAttribute("auto-rotate");

        });

    </script>

</body>

</html>
